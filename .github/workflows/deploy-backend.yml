name: CI/CD Backend
on:
  push:
    branches: ["deploy"]
env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  AWS_REGION: us-east-1
  BACKEND_INSTANCE_ID: "i-0f9c56444916358de" # CAMBIAR POR EL ID DE TU EC2 BACKEND
  BACKEND_APP_DIR: /home/ec2-user/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and Push Ventas
        run: |
          docker build -f back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile -t $DOCKERHUB_NAMESPACE/api-ventas:latest back-Ventas_SpringBoot/Springboot-API-REST
          docker push $DOCKERHUB_NAMESPACE/api-ventas:latest
      - name: Build and Push Despachos
        run: |
          docker build -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile -t $DOCKERHUB_NAMESPACE/api-despachos:latest back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $DOCKERHUB_NAMESPACE/api-despachos:latest
  
  deploy-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup AWS
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region=${AWS_REGION}
          output=json
          EOF
      - name: Deploy vía SSM
        run: |
          aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${BACKEND_INSTANCE_ID}" \
            --parameters commands="[
              \"mkdir -p ${BACKEND_APP_DIR}\",
              \"cd ${BACKEND_APP_DIR}\",
              \"curl -s https://raw.githubusercontent.com/${{ github.repository }}/deploy/docker-compose-backend.yml -o docker-compose.yml\",
              \"echo DOCKERHUB_USERNAME=${DOCKERHUB_NAMESPACE} > .env\",
              \"echo DB_NAME=tienda >> .env\",
              \"echo DB_USERNAME=root >> .env\",
              \"echo DB_PASSWORD=root >> .env\",
              \"docker compose pull\",
              \"docker compose up -d\"
            ]"