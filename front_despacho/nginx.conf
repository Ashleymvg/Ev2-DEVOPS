server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirige el tráfico al Backend en la subred privada
    location /api/v1/ventas {
        proxy_pass http://IP_PRIVADA_BACKEND:8081/api/v1/ventas;
    }

    location /api/v1/despachos {
        proxy_pass http://IP_PRIVADA_BACKEND:8082/api/v1/despachos;
    }
}